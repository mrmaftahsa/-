name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: |
          SDKM=$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "Using $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Check planner boundaries
        run: |
          mkdir -p /tmp/plan-tests
          javac -d /tmp/plan-tests app/src/main/java/ma/baby/meals/Plan.java tests/PlanTest.java
          java -cp /tmp/plan-tests PlanTest
      - name: Build and lint
        run: gradle --no-daemon assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Luqmati-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
